/* Modification rapide des RM */
.rm-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin:14px 0 8px;
}
.rm-head h4{
    margin:0;
    min-width:0;
}
.rm-edit{
    flex:0 0 auto;
    min-height:38px;
    padding:0 12px;
    font-size:12px;
}
@media (max-width:420px){
    .rm-head{
        align-items:flex-start;
        flex-direction:column;
    }
    .rm-edit{
        width:100%;
    }
}


/* ROAD TO GI V3 */
.rm-inline-editor{
    display:flex;
    align-items:end;
    gap:8px;
    margin:10px 0 12px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#0d141c;
}
.rm-inline-editor label{
    flex:1;
    color:var(--muted);
    font-size:12px;
}
.rm-inline-editor input{
    display:block;
    width:100%;
    min-height:42px;
    margin-top:6px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:9px;
    background:#0a1016;
    color:var(--text);
    font-size:16px;
}
.course-session-tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin:10px 0 14px;
}
.course-session-tabs .btn.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
}
.rm-form-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
}
.rm-save-note{
    margin-top:10px;
    color:var(--muted);
    font-size:12px;
}
.navbtn span{font-size:9px}
@media(max-width:520px){
    .rm-form-grid{grid-template-columns:1fr}
    .rm-inline-editor{align-items:stretch;flex-direction:column}
    .course-session-tabs{grid-template-columns:1fr}
    .bottomnav{height:78px}
    .navbtn{font-size:9px}
}

  <script>
(() => {
'use strict';
const DATA = window.ROAD_TO_GI_DATA;
const DAYS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const PLAN = {
  1:{title:'Functional Training - Entraînement 1',kind:'functional',training:'1'},
  2:{title:'Course - Séance 1 + Abdominaux',kind:'running',session:'1'},
  3:{title:'Functional Training - Entraînement 2',kind:'functional',training:'2'},
  4:{title:'Course - Séance 2 + Abdominaux',kind:'running',session:'2'},
  5:{title:'Functional Training - Entraînement 3',kind:'functional',training:'3'},
  6:{title:'Course - Séance 3 + Circuit samedi',kind:'running',session:'3'},
  0:{title:'Repos',kind:'rest'}
};
const DEFAULT={program:1,week:1,page:'home',profile:{bodyWeight:90,bench:110,row:100,shoulder:70,squat:140,deadlift:170,pullup:30,cooper:3000},completed:{},notes:{},history:[]};
let state=load();
let timer={mode:'idle',seconds:0,initial:0,interval:null,startedAt:null};
const app=document.getElementById('app');
function load(){try{return {...DEFAULT,...JSON.parse(localStorage.getItem('roadToGI_v1')||'{}'),profile:{...DEFAULT.profile,...(JSON.parse(localStorage.getItem('roadToGI_v1')||'{}').profile||{})}}}catch(e){return structuredClone(DEFAULT)}}
function save(){localStorage.setItem('roadToGI_v1',JSON.stringify(state))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pctWeight(max,pct,adjust=0){const raw=max*((pct+adjust)/100);return Math.round(raw/2.5)*2.5}
function vma(){return +(Number(state.profile.cooper)*5/1000).toFixed(1)}
function dist(speed,sec){return Math.round(speed*1000/3600*sec)}
function todayIndex(){return new Date().getDay()}
function key(parts){return [state.program,state.week,...parts].join('-')}
function isDone(k){return !!state.completed[k]}
function toggle(k){state.completed[k]=!state.completed[k];save();render()}
function countWeekDone(){return Object.entries(state.completed).filter(([k,v])=>v&&k.startsWith(`${state.program}-${state.week}-day-`)).length}
function splitSteps(text){if(!text)return[];return text.split('\n').map(s=>s.trim()).filter(s=>s.length>1&&!/^Thibault DEPLEDT$/i.test(s)).slice(0,180)}
function header(){return `<div class="shell"><header class="topbar"><div class="brand"><div class="brandmark">GI</div><div><h1>ROAD TO GI</h1><p>Invictus - Programme ${state.program} / Semaine ${state.week}</p></div></div><div class="top-controls"><select id="programSel" class="compact-select" aria-label="Programme">${[1,2,3,4].map(n=>`<option ${n===state.program?'selected':''} value="${n}">P${n}</option>`).join('')}</select><select id="weekSel" class="compact-select" aria-label="Semaine">${[1,2,3,4].map(n=>`<option ${n===state.week?'selected':''} value="${n}">S${n}</option>`).join('')}</select></div></header><main class="main" id="view"></main>${nav()}</div>`}
function nav(){const items=[['home','⌂','Aujourd’hui'],['program','▦','Programme'],['strength','🏋','Force'],['running','🏃','Course'],['progress','↗','Suivi'],['profile','⚙','Profil']];return `<nav class="bottomnav">${items.map(([p,i,l])=>`<button class="navbtn ${state.page===p?'active':''}" data-page="${p}"><b>${i}</b><span>${l}</span></button>`).join('')}</nav>`}
function render(){app.innerHTML=header();bindShell();const view=document.getElementById('view');if(state.page==='home')view.innerHTML=homeView();if(state.page==='program')view.innerHTML=programView();if(state.page==='session')view.innerHTML=sessionView();if(state.page==='strength')view.innerHTML=strengthPageView();if(state.page==='running')view.innerHTML=runningPageView();if(state.page==='progress')view.innerHTML=progressView();if(state.page==='profile')view.innerHTML=profileView();bindView()}
function bindShell(){document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{state.page=b.dataset.page;save();render()}));document.getElementById('programSel').addEventListener('change',e=>{state.program=+e.target.value;save();render()});document.getElementById('weekSel').addEventListener('change',e=>{state.week=+e.target.value;save();render()})}
function homeView(){const d=todayIndex(),plan=PLAN[d],done=countWeekDone();const percent=Math.round(done/6*100);return `<section class="hero"><p class="eyebrow">SÉANCE DU JOUR - ${DAYS[d].toUpperCase()}</p><h2>${esc(plan.title)}</h2><p class="muted">Programme ${state.program} · Semaine ${state.week}</p><div class="hero-actions"><button class="btn primary" id="goSession">Ouvrir la séance</button><button class="btn" id="goProgram">Voir la semaine</button></div></section><div class="grid stats"><div class="stat"><span>Cooper</span><strong>${state.profile.cooper} m</strong></div><div class="stat"><span>VMA estimée</span><strong>${vma()} km/h</strong></div><div class="stat"><span>VMA + 2</span><strong>${(vma()+2).toFixed(1)} km/h</strong></div><div class="stat"><span>Semaine</span><strong>${done}/6</strong></div></div><div class="card"><div class="card-head"><h3>Progression semaine</h3><span class="tag">${percent}%</span></div><div class="progress"><div style="width:${percent}%"></div></div></div><div class="card"><div class="card-head"><h3>Planning</h3><span class="tag">P${state.program} · S${state.week}</span></div><div class="schedule">${[1,2,3,4,5,6,0].map(i=>`<button class="schedule-row ${i===d?'today':''}" data-day="${i}"><span class="day">${DAYS[i].toUpperCase()}</span><span class="kind">${esc(PLAN[i].title)}</span><span class="arrow">›</span></button>`).join('')}</div></div>`}
function programView(){return `<h2 class="section-title">Programme ${state.program}</h2><div class="tabs">${[1,2,3,4].map(w=>`<button class="tab ${w===state.week?'active':''}" data-weektab="${w}">Semaine ${w}</button>`).join('')}</div><div class="card"><div class="card-head"><h3>Semaine ${state.week}</h3><span class="tag">6 séances + repos</span></div><div class="schedule">${[1,2,3,4,5,6,0].map(i=>`<button class="schedule-row" data-day="${i}"><span class="day">${DAYS[i].toUpperCase()}</span><span class="kind">${esc(PLAN[i].title)}</span><span class="arrow">›</span></button>`).join('')}</div></div><div class="notice">Le contenu est tiré des 16 PDF fournis. Les charges calculées arrondissent au multiple de 2,5 kg le plus proche. Tu peux modifier tes RM directement dans l’onglet Force ou dans une séance de musculation.</div>`}
function selectedDay(){const x=Number(sessionStorage.getItem('roadToGI_day'));return Number.isInteger(x)&&x>=0&&x<=6?x:todayIndex()}
function sessionView(){const d=selectedDay(),p=PLAN[d];if(p.kind==='rest')return `<section class="hero"><p class="eyebrow">DIMANCHE</p><h2>Repos</h2><p class="muted">Récupération selon le planning du programme.</p></section>`;return `<div class="card"><div class="card-head"><div><p class="eyebrow" style="margin-bottom:4px">${DAYS[d].toUpperCase()}</p><h3>${esc(p.title)}</h3></div><button class="btn ${isDone(key(['day',d]))?'good':''}" id="finishDay">${isDone(key(['day',d]))?'Séance validée ✓':'Valider séance'}</button></div></div>${timerCard()}${p.kind==='functional'?functionalView(p.training):runningView(p.session,d)}`}
function timerCard(){return `<div class="card timer-panel"><div class="card-head"><h3>Chrono</h3><span id="timerStatus" class="tag">Prêt</span></div><div id="timerDisplay" class="timer-display">00:00</div><div class="pill-row" style="justify-content:center"><button class="btn primary" id="timerStart">Démarrer</button><button class="btn" id="timerPause">Pause</button><button class="btn danger" id="timerReset">Reset</button></div><div class="quick-timers"><button class="btn" data-timer="30">30 s</button><button class="btn" data-timer="60">1 min</button><button class="btn" data-timer="90">1:30</button><button class="btn" data-timer="120">2 min</button><button class="btn" data-timer="180">3 min</button><button class="btn" data-timer="240">4 min</button></div></div>`}
function functionalView(training){const dat=DATA[String(state.program)].functional[training];if(!dat)return `<div class="empty">Séance non trouvée.</div>`;const w=dat.weeks[String(state.week)]||{};const adjustment=training==='3'?-2.5:0;const primary=training==='2'?[['Shoulders press','shoulder'],['Back squat','squat']]:[['Développé couché','bench'],['Tirage horizontal / Row','row']];return `<div class="card"><div class="card-head"><h3>Force - ${esc(dat.title)}</h3><span class="tag">Cycle P${state.program} S${state.week}</span></div>${primary.map(([name,rm])=>forceExercise(name,rm,adjustment)).join('')}<div class="divider"></div><button class="btn ghost source-toggle" data-toggle-source="strengthSource">Afficher les consignes originales</button><div id="strengthSource" class="source-block" hidden>${esc(dat.strength)}</div></div><div class="card"><div class="card-head"><h3>WOD - Semaine ${state.week}</h3><span class="tag">${esc(w.headline||'')}</span></div>${checklist(w.body||'',`wod-${training}`)}<button class="btn ghost source-toggle" data-toggle-source="wodSource">Texte source</button><div id="wodSource" class="source-block" hidden>${esc(w.body||'')}</div></div>`}
function forceExercise(name,rmKey,adjust){const cycle=DATA[String(state.program)].forceCycle[String(state.week)]||[];const max=Number(state.profile[rmKey]||0);let rows='';cycle.forEach((r,ri)=>{for(let s=1;s<=r.sets;s++){const k=key(['force',name,ri,s]);rows+=`<div class="force-row"><div><strong>${esc(name)}</strong><div class="muted" style="font-size:11px">${r.pct+adjust}% · ${esc(r.reps)} rep${r.reps==='1'?'':'s'}</div></div><input inputmode="decimal" aria-label="Charge" value="${pctWeight(max,r.pct,adjust)}" data-loadkey="${esc(k)}"><input inputmode="numeric" aria-label="Répétitions" value="${r.reps==='MAX'?'':esc(r.reps)}"><button class="check ${isDone(k)?'done':''}" data-toggle="${esc(k)}">✓</button></div>`}});return `<div class="rm-head"><h4>${esc(name)} <span class="muted" style="font-weight:400">RM actuel : ${max} kg${adjust?` · ajustement ${adjust}%`:''}</span></h4></div><div class="rm-inline-editor"><label>Modifier le RM de ${esc(name)}<input type="number" step="0.5" min="0" value="${max}" data-rm-input="${esc(rmKey)}"></label><button type="button" class="btn primary" data-rm-save="${esc(rmKey)}">Appliquer</button></div><div class="force-grid">${rows}</div>`}

function runningView(session,d){const dat=DATA[String(state.program)].running[String(state.week)]?.[session]||'';const base=vma(),train2=base+2,train1=base+1;const extra=d===6?saturdayExtras():abExtras();return `<div class="card"><div class="card-head"><h3>Calculs de course</h3><span class="tag">Cooper ${state.profile.cooper} m</span></div><div class="grid stats" style="margin:0"><div class="stat"><span>VMA Cooper</span><strong>${base.toFixed(1)}</strong></div><div class="stat"><span>VMA +1</span><strong>${train1.toFixed(1)}</strong></div><div class="stat"><span>VMA +2</span><strong>${train2.toFixed(1)}</strong></div><div class="stat"><span>30 s à VMA+2</span><strong>${dist(train2,30)} m</strong></div></div><div class="result" style="margin-top:12px">45 s à VMA+2 : <strong>${dist(train2,45)} m</strong> · 60 s : <strong>${dist(train2,60)} m</strong></div></div><div class="card"><div class="card-head"><h3>Course - Séance ${session}</h3><span class="tag">Semaine ${state.week}</span></div>${checklist(dat,`run-${session}`)}<button class="btn ghost source-toggle" data-toggle-source="runSource">Texte source</button><div id="runSource" class="source-block" hidden>${esc(dat)}</div></div>${extra}`}
function circuitSelector(kind,title){const circuits=DATA[String(state.program)][kind]||{};const nums=Object.keys(circuits);if(!nums.length)return'';const selectId=`${kind}Select`;return `<div class="card"><div class="card-head"><h3>${title}</h3><select class="compact-select" id="${selectId}">${nums.map(n=>`<option value="${n}">Circuit ${n}</option>`).join('')}</select></div><div id="${kind}Body">${checklist(circuits[nums[0]],`${kind}-${nums[0]}`)}</div></div>`}
function abExtras(){return circuitSelector('abs','Circuit abdominaux (au choix)')}
function saturdayExtras(){return circuitSelector('circuits','Circuit du samedi (facultatif)')+circuitSelector('abs','Circuit abdominaux (au choix)')}
function checklist(text,prefix){const steps=splitSteps(text);if(!steps.length)return `<div class="empty">Aucun détail extrait.</div>`;return `<div class="worklist">${steps.map((s,i)=>{const k=key([prefix,i]);return `<label class="workitem ${isDone(k)?'done':''}"><input type="checkbox" data-check="${esc(k)}" ${isDone(k)?'checked':''}><span class="worktext">${esc(s)}</span></label>`}).join('')}</div>`}

function strengthPageView(){
    const fields=[
        ['bench','Développé couché'],
        ['row','Row / tirage horizontal'],
        ['shoulder','Shoulder press'],
        ['squat','Back squat'],
        ['deadlift','Deadlift'],
        ['pullup','Traction lestée (charge ajoutée)']
    ];
    const cycle=DATA[String(state.program)].forceCycle[String(state.week)]||[];
    const cycleHtml=cycle.map(r=>`<div class="workitem"><span class="worktext"><strong>${r.sets} série${r.sets>1?'s':''} × ${esc(r.reps)} rep${String(r.reps)==='1'?'':'s'}</strong> à ${r.pct}%</span></div>`).join('');
    return `<h2 class="section-title">Force</h2>
    <form id="rmQuickForm" class="card">
        <div class="card-head"><h3>Mes RM</h3><span class="tag">modifiables</span></div>
        <div class="rm-form-grid">
            ${fields.map(([k,l])=>`<div class="field"><label for="rmq_${k}">${l} (kg)</label><input id="rmq_${k}" name="${k}" type="number" step="0.5" min="0" value="${state.profile[k]}"></div>`).join('')}
        </div>
        <div class="hero-actions"><button class="btn primary" type="submit">Enregistrer les RM</button></div>
        <div class="rm-save-note">Les charges des séances sont recalculées immédiatement après l’enregistrement.</div>
    </form>
    <div class="card">
        <div class="card-head"><h3>Cycle de force</h3><span class="tag">P${state.program} · S${state.week}</span></div>
        <div class="worklist">${cycleHtml||'<div class="empty">Cycle non trouvé.</div>'}</div>
    </div>
    <div class="card">
        <div class="card-head"><h3>Aperçu des charges</h3><span class="tag">arrondi 2,5 kg</span></div>
        <div class="result">
            ${cycle.map(r=>`<strong>${r.pct}%</strong> : DC ${pctWeight(state.profile.bench,r.pct)} kg · Row ${pctWeight(state.profile.row,r.pct)} kg · Shoulder ${pctWeight(state.profile.shoulder,r.pct)} kg · Squat ${pctWeight(state.profile.squat,r.pct)} kg`).join('<br>')}
        </div>
    </div>`;
}

function runningPageView(){
    let session=Number(sessionStorage.getItem('roadToGI_runSession')||1);
    if(![1,2,3].includes(session))session=1;
    const dat=DATA[String(state.program)].running[String(state.week)]?.[String(session)]||DATA[String(state.program)].running[String(state.week)]?.[session]||'';
    const base=vma(),train1=base+1,train2=base+2;
    const dayForSession={1:2,2:4,3:6};
    return `<h2 class="section-title">Course à pied</h2>
    <div class="card">
        <div class="card-head"><h3>Référence Cooper / VMA</h3><span class="tag">calcul auto</span></div>
        <div class="rm-inline-editor">
            <label>Distance Cooper en 12 min (m)
                <input id="courseCooperInput" type="number" step="10" min="0" value="${state.profile.cooper}">
            </label>
            <button type="button" class="btn primary" id="saveCourseCooper">Mettre à jour</button>
        </div>
        <div class="grid stats" style="margin:0">
            <div class="stat"><span>VMA Cooper</span><strong>${base.toFixed(1)} km/h</strong></div>
            <div class="stat"><span>VMA +1</span><strong>${train1.toFixed(1)} km/h</strong></div>
            <div class="stat"><span>VMA +2</span><strong>${train2.toFixed(1)} km/h</strong></div>
            <div class="stat"><span>30 s à VMA+2</span><strong>${dist(train2,30)} m</strong></div>
        </div>
        <div class="result" style="margin-top:12px">45 s à VMA+2 : <strong>${dist(train2,45)} m</strong> · 60 s : <strong>${dist(train2,60)} m</strong></div>
    </div>
    <div class="card">
        <div class="card-head"><h3>Séances de la semaine</h3><span class="tag">Semaine ${state.week}</span></div>
        <div class="course-session-tabs">
            ${[1,2,3].map(n=>`<button type="button" class="btn ${session===n?'active':''}" data-runselect="${n}">${n===1?'Mardi':n===2?'Jeudi':'Samedi'} · Séance ${n}</button>`).join('')}
        </div>
        ${checklist(dat,`runpage-${session}`)}
        <div class="hero-actions">
            <button type="button" class="btn primary" data-open-run="${dayForSession[session]}">Ouvrir cette séance avec chrono</button>
        </div>
    </div>`;
}

function progressView(){const history=state.history.slice().reverse();const dayDone=countWeekDone();return `<h2 class="section-title">Suivi</h2><div class="grid stats"><div class="stat"><span>Séances validées</span><strong>${dayDone}/6</strong></div><div class="stat"><span>Cooper</span><strong>${state.profile.cooper} m</strong></div><div class="stat"><span>VMA</span><strong>${vma()} km/h</strong></div><div class="stat"><span>Poids</span><strong>${state.profile.bodyWeight} kg</strong></div></div><div class="card"><div class="card-head"><h3>Historique</h3><button class="btn" id="addMeasure">Ajouter mesure</button></div>${history.length?history.map(h=>`<div class="history-row"><div><strong>${esc(h.label)}</strong><br><small>${esc(h.date)}</small></div><div>${esc(h.value)}</div></div>`).join(''):`<div class="empty">Aucune mesure enregistrée pour l’instant.</div>`}</div><div class="card"><h3>Références force</h3><div class="result" style="margin-top:12px">Développé couché <strong>${state.profile.bench} kg</strong><br>Row <strong>${state.profile.row} kg</strong><br>Shoulder press <strong>${state.profile.shoulder} kg</strong><br>Squat <strong>${state.profile.squat} kg</strong><br>Deadlift <strong>${state.profile.deadlift} kg</strong><br>Traction lestée <strong>+${state.profile.pullup} kg</strong></div></div>`}
function profileView(){const fields=[['bodyWeight','Poids du corps (kg)'],['cooper','Cooper - distance en 12 min (m)'],['bench','Développé couché RM (kg)'],['row','Row / tirage RM (kg)'],['shoulder','Shoulder press RM (kg)'],['squat','Back squat RM (kg)'],['deadlift','Deadlift RM (kg)'],['pullup','Traction lestée RM ajouté (kg)']];return `<h2 class="section-title">Profil sportif</h2><form id="profileForm" class="card"><div class="form-grid">${fields.map(([k,l])=>`<div class="field"><label for="p_${k}">${l}</label><input id="p_${k}" name="${k}" type="number" step="0.5" min="0" value="${state.profile[k]}"></div>`).join('')}</div><div class="hero-actions"><button class="btn primary" type="submit">Enregistrer</button><button class="btn danger" type="button" id="resetApp">Réinitialiser l’application</button></div></form><div class="card"><div class="card-head"><h3>Calcul automatique</h3><span class="tag">VMA</span></div><div class="result">Avec un Cooper de <strong>${state.profile.cooper} m</strong>, l’application calcule une VMA de <strong>${vma()} km/h</strong>. À VMA +2 : 30 s ≈ <strong>${dist(vma()+2,30)} m</strong>, 45 s ≈ <strong>${dist(vma()+2,45)} m</strong>.</div></div><div class="notice">Les données restent sur cet appareil via le stockage local du navigateur. Cette V1 fonctionne sans compte et peut être installée comme PWA.</div>`}
function setDay(d){sessionStorage.setItem('roadToGI_day',String(d));state.page='session';save();render()}
function bindView(){const go=document.getElementById('goSession');if(go)go.onclick=()=>setDay(todayIndex());const gp=document.getElementById('goProgram');if(gp)gp.onclick=()=>{state.page='program';save();render()};document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>setDay(+b.dataset.day));document.querySelectorAll('[data-weektab]').forEach(b=>b.onclick=()=>{state.week=+b.dataset.weektab;save();render()});const finish=document.getElementById('finishDay');if(finish)finish.onclick=()=>toggle(key(['day',selectedDay()]));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggle(b.dataset.toggle));document.querySelectorAll('[data-check]').forEach(cb=>cb.onchange=()=>{state.completed[cb.dataset.check]=cb.checked;save();cb.closest('.workitem').classList.toggle('done',cb.checked)});document.querySelectorAll('[data-toggle-source]').forEach(b=>b.onclick=()=>{const el=document.getElementById(b.dataset.toggleSource);el.hidden=!el.hidden;b.textContent=el.hidden?'Afficher le texte source':'Masquer le texte source'});document.querySelectorAll('[data-rm-save]').forEach(b=>b.onclick=()=>{const rmKey=b.dataset.rmSave;const input=document.querySelector(`[data-rm-input="${rmKey}"]`);if(!input)return;const value=Number(String(input.value).replace(',','.'));if(!Number.isFinite(value)||value<0){input.focus();return}state.profile[rmKey]=value;save();render()});document.querySelectorAll('[data-runselect]').forEach(b=>b.onclick=()=>{sessionStorage.setItem('roadToGI_runSession',b.dataset.runselect);render()});document.querySelectorAll('[data-open-run]').forEach(b=>b.onclick=()=>setDay(+b.dataset.openRun));const saveCooper=document.getElementById('saveCourseCooper');if(saveCooper)saveCooper.onclick=()=>{const input=document.getElementById('courseCooperInput');const value=Number(input.value);if(!Number.isFinite(value)||value<=0){input.focus();return}state.profile.cooper=value;save();render()};const rmQuick=document.getElementById('rmQuickForm');if(rmQuick)rmQuick.onsubmit=e=>{e.preventDefault();const fd=new FormData(rmQuick);for(const [k,v] of fd.entries()){const value=Number(String(v).replace(',','.'));if(Number.isFinite(value)&&value>=0)state.profile[k]=value}save();render()};bindTimer();bindCircuit('abs');bindCircuit('circuits');const pf=document.getElementById('profileForm');if(pf)pf.onsubmit=e=>{e.preventDefault();const fd=new FormData(pf);for(const [k,v] of fd.entries())state.profile[k]=Math.max(0,Number(v)||0);save();render()};const reset=document.getElementById('resetApp');if(reset)reset.onclick=()=>{if(confirm('Effacer tes réglages et ton historique ?')){localStorage.removeItem('roadToGI_v1');state=structuredClone(DEFAULT);render()}};const add=document.getElementById('addMeasure');if(add)add.onclick=()=>{const label=prompt('Mesure (ex : Cooper, 8 km, poids)');if(!label)return;const value=prompt('Valeur (ex : 3050 m, 41:20, 88 kg)');if(!value)return;state.history.push({label,value,date:new Date().toLocaleDateString('fr-FR')});save();render()}}
function bindCircuit(kind){const sel=document.getElementById(`${kind}Select`),body=document.getElementById(`${kind}Body`);if(!sel||!body)return;sel.onchange=()=>{const n=sel.value;body.innerHTML=checklist(DATA[String(state.program)][kind][n],`${kind}-${n}`);body.querySelectorAll('[data-check]').forEach(cb=>cb.onchange=()=>{state.completed[cb.dataset.check]=cb.checked;save();cb.closest('.workitem').classList.toggle('done',cb.checked)})}}
function formatTime(sec){sec=Math.max(0,Math.floor(sec));const m=Math.floor(sec/60),s=sec%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function timerTick(){if(timer.mode!=='running')return;if(timer.initial>0){timer.seconds=Math.max(0,timer.seconds-1);if(timer.seconds<=0){timer.mode='done';clearInterval(timer.interval);timer.interval=null;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}}else timer.seconds+=1;paintTimer()}
function paintTimer(){const d=document.getElementById('timerDisplay'),s=document.getElementById('timerStatus');if(d)d.textContent=formatTime(timer.seconds);if(s)s.textContent=timer.mode==='running'?'En cours':timer.mode==='paused'?'Pause':timer.mode==='done'?'Terminé':'Prêt'}
function startTimer(seconds=null){if(timer.interval)clearInterval(timer.interval);if(seconds!==null){timer.initial=seconds;timer.seconds=seconds}else if(timer.mode==='idle'||timer.mode==='done'){timer.initial=0;timer.seconds=0}timer.mode='running';timer.interval=setInterval(timerTick,1000);paintTimer()}
function pauseTimer(){if(timer.mode==='running'){clearInterval(timer.interval);timer.interval=null;timer.mode='paused';paintTimer()}}
function resetTimer(){if(timer.interval)clearInterval(timer.interval);timer={mode:'idle',seconds:0,initial:0,interval:null,startedAt:null};paintTimer()}
function bindTimer(){const st=document.getElementById('timerStart'),pa=document.getElementById('timerPause'),re=document.getElementById('timerReset');if(st)st.onclick=()=>startTimer(timer.mode==='paused'?null:null);if(pa)pa.onclick=pauseTimer;if(re)re.onclick=resetTimer;document.querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>startTimer(+b.dataset.timer));paintTimer()}
render();
})();
  </script>

  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
  </script>

</body>
</html>
